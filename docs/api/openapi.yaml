openapi: 3.1.0
info:
  title: B4Gone API
  version: 0.1.0
  description: |
    JSON API behind the B4Gone website. Sessions are signed JWTs stored in the HttpOnly
    `b4gone_session` cookie, so browsers send them automatically and scripts cannot read them.

    State-changing requests from a browser must come from the B4Gone site: a request whose
    `Origin` (or `Sec-Fetch-Site`) shows another site is rejected with `403 forbidden_origin`.
    Non-browser clients that send neither header are accepted.

    Every error uses the same shape: `{ "error": { "code", "message", "fields"? } }`, where
    `fields` maps a request field to the message to show next to it.

    Subscription endpoints come from issue #7; dashboard endpoints are added by issue #9.
servers:
  - url: https://b4gone.vercel.app
    description: Production
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Accounts
    description: Registration, sign-in, sign-out, and the current session (issue #2).
  - name: Items
    description: Purchases with return and warranty deadlines, private to the signed-in user (issues #4 and #5).
  - name: Subscriptions
    description: Monthly and yearly subscriptions with next billing dates and cancel/reactivate, private to the signed-in user (issue #7).

paths:
  /api/auth/register:
    post:
      tags: [Accounts]
      summary: Create an account and start a session
      description: |
        The email is trimmed and lowercased before it is stored, so addresses that differ only in
        case belong to the same account. The password is hashed with bcrypt and never returned.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
            example: { email: jane@example.com, password: correct horse battery }
      responses:
        "201":
          description: Account created. The response sets the session cookie.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
              example: { user: { id: 4b3f3f0c-6a51-4c39-9a64-2f0f6f1d8e21, email: jane@example.com } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "409":
          description: An account with this email already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: email_taken
                  message: Check the highlighted fields.
                  fields: { email: An account with this email already exists. Sign in instead. }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/login:
    post:
      tags: [Accounts]
      summary: Sign in and start a session
      description: |
        A wrong password and an unknown email return the same `401` response, so the API does not
        reveal which addresses have accounts.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
            example: { email: jane@example.com, password: correct horse battery }
      responses:
        "200":
          description: Signed in. The response sets the session cookie.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: The email and password do not match an account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: invalid_credentials, message: Invalid email or password. } }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/logout:
    post:
      tags: [Accounts]
      summary: End the session
      description: Clears the session cookie. It succeeds even when no session exists.
      operationId: logout
      security: []
      responses:
        "204":
          description: Signed out. The response expires the session cookie (`Max-Age=0`).
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/auth/me:
    get:
      tags: [Accounts]
      summary: Get the signed-in user
      description: |
        Returns the account named by the verified session cookie. Query parameters or headers that
        name another user are ignored. A valid token for a deleted account returns `401`.
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: unauthenticated, message: Sign in to continue. } }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/items:
    post:
      tags: [Items]
      summary: Save a purchase
      description: |
        Saves one item for the signed-in user; any owner field in the body is ignored. The purchase
        date may not be later than today in the request's `timeZone`, so the check follows the
        user's calendar rather than the server's. New items start as `active`.
      operationId: createItem
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewItemRequest" }
            example:
              name: Wool coat
              purchaseDate: "2026-10-09"
              priceCents: 18950
              returnDeadline: "2026-11-08"
              warrantyExpiration: null
              timeZone: America/New_York
      responses:
        "201":
          description: The saved item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResponse" }
        "400":
          description: The body is not JSON or not sent as `application/json` (`invalid_json`), or a field is invalid (`validation_failed`). Every invalid field is reported at once; a missing or unknown `timeZone` is reported on its own.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                validation:
                  value:
                    error:
                      code: validation_failed
                      message: Check the highlighted fields.
                      fields:
                        name: Enter a name.
                        purchaseDate: Purchase date can’t be in the future.
                        priceCents: Enter an amount up to $999,999.99.
                timeZone:
                  value:
                    error:
                      code: validation_failed
                      message: Check the highlighted fields.
                      fields: { timeZone: Your browser’s time zone could not be read. Reload the page and try again. }
                json:
                  value: { error: { code: invalid_json, message: Send the request body as JSON. } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/ServerError" }
    get:
      tags: [Items]
      summary: List the signed-in user's items
      description: Newest purchase date first, then by name (ignoring case), then in the order the items were added.
      operationId: listItems
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The user's items; an empty array for a new account.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/items/{id}:
    get:
      tags: [Items]
      summary: Get one of the signed-in user's items
      description: Another user's item, a missing item, and a malformed id all return the same `404`.
      operationId: getItem
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ItemNotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [Items]
      summary: Replace an item's fields
      description: |
        Replaces all five editable fields with the same rules as creating an item (issue #5). This
        is a full replacement: every field must be sent, with `null` to clear an optional one. The
        status is not changed; use `PUT /api/items/{id}/status` for that.
      operationId: updateItem
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemReplacementRequest" }
            example:
              name: Navy wool coat
              purchaseDate: "2026-10-09"
              priceCents: null
              returnDeadline: "2026-11-08"
              warrantyExpiration: null
              timeZone: America/New_York
      responses:
        "200":
          description: The updated item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResponse" }
        "400":
          description: Same as creating an item, plus a field message for each optional field left out of the body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: validation_failed
                  message: Check the highlighted fields.
                  fields: { warrantyExpiration: "Send this field, or null to leave it empty." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/ItemNotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Items]
      summary: Delete an item
      description: Deletes the item and, with it, its dashboard deadlines (issue #5). The website asks for confirmation first.
      operationId: deleteItem
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: Deleted. A second request for the same id returns `404`.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/ItemNotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/items/{id}/status:
    put:
      tags: [Items]
      summary: Mark an item returned, or active again
      description: |
        A returned item keeps its record but has no dashboard deadlines; setting it back to `active`
        restores the deadlines that are still ahead (issue #5). Sending the status the item already
        has returns `200` with the item and does not count as a change.
      operationId: setItemStatus
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemStatusRequest" }
            example: { status: returned }
      responses:
        "200":
          description: The item with its new status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemResponse" }
        "400":
          description: The body is not JSON (`invalid_json`), or `status` is not `active` or `returned` (`validation_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: validation_failed
                  message: Check the highlighted fields.
                  fields: { status: Choose active or returned. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/ItemNotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/subscriptions:
    post:
      tags: [Subscriptions]
      summary: Save a subscription
      description: |
        Saves one monthly or yearly subscription for the signed-in user (issue #7); any owner or
        status field in the body is ignored, and new subscriptions start as `active`. The first
        billing date is the recurring anchor and may be in the future. `timeZone` gives the user's
        today, which the response's `nextBillingDate` is calculated from.
      operationId: createSubscription
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionRequest" }
            example:
              name: Music plan
              amountCents: 1099
              billingCycle: monthly
              firstBillingDate: "2026-01-31"
              timeZone: America/New_York
      responses:
        "201":
          description: The saved subscription with its next billing date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionResponse" }
        "400":
          description: The body is not JSON or not sent as `application/json` (`invalid_json`), or a field is invalid (`validation_failed`). Every invalid field is reported at once; a missing or unknown `timeZone` is reported on its own.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                validation:
                  value:
                    error:
                      code: validation_failed
                      message: Check the highlighted fields.
                      fields:
                        name: Enter a service name.
                        amountCents: Enter the amount. Use 0 for a free plan.
                        billingCycle: Choose monthly or yearly.
                        firstBillingDate: Enter a complete, real date.
                timeZone:
                  value:
                    error:
                      code: validation_failed
                      message: Check the highlighted fields.
                      fields: { timeZone: Your browser’s time zone could not be read. Reload the page and try again. }
                json:
                  value: { error: { code: invalid_json, message: Send the request body as JSON. } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "500": { $ref: "#/components/responses/ServerError" }
    get:
      tags: [Subscriptions]
      summary: List the signed-in user's subscriptions
      description: |
        By name (ignoring case), then in the order the subscriptions were added. Each subscription
        includes its next billing date for today in `timeZone`. `averageMonthlyCostCents` is the
        average monthly cost of the active subscriptions (issue #8): monthly amounts plus one
        twelfth of yearly amounts, rounded once to whole cents.
      operationId: listSubscriptions
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: The user's subscriptions; an empty array and `0` for a new account.
          content:
            application/json:
              schema:
                type: object
                required: [subscriptions, averageMonthlyCostCents]
                properties:
                  subscriptions:
                    type: array
                    items: { $ref: "#/components/schemas/Subscription" }
                  averageMonthlyCostCents: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/TimeZoneMissing" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/subscriptions/{id}:
    get:
      tags: [Subscriptions]
      summary: Get one of the signed-in user's subscriptions
      description: Another user's subscription, a missing one, and a malformed id all return the same `404`.
      operationId: getSubscription
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: The subscription with its next billing date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionResponse" }
        "400": { $ref: "#/components/responses/TimeZoneMissing" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/SubscriptionNotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [Subscriptions]
      summary: Replace a subscription's fields
      description: |
        Replaces the name, amount, billing cycle, and first billing date with the same rules as
        creating a subscription. Changing the first billing date changes the anchor that later
        charges repeat from. The status is not changed; use `PUT /api/subscriptions/{id}/status`.
      operationId: updateSubscription
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionRequest" }
            example:
              name: Family music
              amountCents: 1699
              billingCycle: yearly
              firstBillingDate: "2025-11-15"
              timeZone: America/New_York
      responses:
        "200":
          description: The updated subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionResponse" }
        "400":
          description: Same as creating a subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: validation_failed
                  message: Check the highlighted fields.
                  fields: { amountCents: Amount can’t be negative. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/SubscriptionNotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Subscriptions]
      summary: Delete a subscription
      description: Deletes the subscription and, with it, its renewal reminder and its share of the monthly cost. The website asks for confirmation first.
      operationId: deleteSubscription
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "204":
          description: Deleted. A second request for the same id returns `404`.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/SubscriptionNotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/subscriptions/{id}/status:
    put:
      tags: [Subscriptions]
      summary: Cancel a subscription, or reactivate it
      description: |
        A cancelled subscription keeps its record but has no next billing date, no renewal reminder,
        and no share of the monthly cost. Reactivating it calculates the next billing date from the
        original first billing date again (issue #7). Sending the status the subscription already
        has returns `200` and does not count as a change.
      operationId: setSubscriptionStatus
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionStatusRequest" }
            example: { status: cancelled, timeZone: America/New_York }
      responses:
        "200":
          description: The subscription with its new status and next billing date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionResponse" }
        "400":
          description: The body is not JSON (`invalid_json`), `status` is not `active` or `cancelled`, or `timeZone` is missing or unknown (`validation_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: validation_failed
                  message: Check the highlighted fields.
                  fields: { status: Choose active or cancelled. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404": { $ref: "#/components/responses/SubscriptionNotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: b4gone_session
      description: Signed HS256 JWT set by register or login. Valid for 7 days.

  parameters:
    ItemId:
      name: id
      in: path
      required: true
      description: Another user's item, a missing item, and a malformed id all return the same `404`.
      schema: { type: string, format: uuid }

    SubscriptionId:
      name: id
      in: path
      required: true
      description: Another user's subscription, a missing one, and a malformed id all return the same `404`.
      schema: { type: string, format: uuid }
    TimeZone:
      name: timeZone
      in: query
      required: true
      description: The user's IANA time zone, such as `America/New_York`, used to find today's date for next billing dates.
      schema: { type: string }
      example: America/New_York

  headers:
    SessionCookie:
      description: "`b4gone_session=<token>; Path=/; Max-Age=604800; HttpOnly; SameSite=Lax`, plus `Secure` in production."
      schema: { type: string }

  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
      description: Trimmed and lowercased by the server.
    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password:
          type: string
          minLength: 8
          description: At least 8 characters and at most 72 bytes in UTF-8 (bcrypt's limit). Longer passwords are rejected, not truncated. Spaces are kept.
    SignInRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password:
          type: string
          minLength: 1
          description: At most 72 bytes in UTF-8.
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
    UserResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    DateOnly:
      type: string
      format: date
      description: A calendar date as `YYYY-MM-DD`, with no time or time zone.
    NewItemRequest:
      type: object
      required: [name, purchaseDate, timeZone]
      properties:
        name:
          type: string
          description: 1–100 characters after trimming, with at least one visible character and no control characters such as tabs or line breaks; the trimmed name is stored.
        purchaseDate:
          allOf: [{ $ref: "#/components/schemas/DateOnly" }]
          description: On or before today in `timeZone`.
        priceCents:
          type: [integer, "null"]
          minimum: 0
          maximum: 99999999
          description: Price in US cents, up to $999,999.99. `null` or omitted means not entered; `0` means free.
        returnDeadline:
          oneOf: [{ $ref: "#/components/schemas/DateOnly" }, { type: "null" }]
          description: On or after the purchase date. `null` or omitted means not set.
        warrantyExpiration:
          oneOf: [{ $ref: "#/components/schemas/DateOnly" }, { type: "null" }]
          description: On or after the purchase date. `null` or omitted means not set.
        timeZone:
          type: string
          description: The user's IANA time zone, such as `America/New_York`, used to find today's date.
    ItemReplacementRequest:
      description: The same fields as a new item, all required; `null` clears an optional field.
      allOf:
        - $ref: "#/components/schemas/NewItemRequest"
        - required: [name, purchaseDate, priceCents, returnDeadline, warrantyExpiration, timeZone]
    ItemStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, returned] }
    Item:
      type: object
      required: [id, name, purchaseDate, priceCents, returnDeadline, warrantyExpiration, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        purchaseDate: { $ref: "#/components/schemas/DateOnly" }
        priceCents: { type: [integer, "null"] }
        returnDeadline:
          oneOf: [{ $ref: "#/components/schemas/DateOnly" }, { type: "null" }]
        warrantyExpiration:
          oneOf: [{ $ref: "#/components/schemas/DateOnly" }, { type: "null" }]
        status: { type: string, enum: [active, returned] }
      example:
        id: 9d7a1c52-0d6f-4f4e-8a9b-3c1e2f4a5b6c
        name: Wool coat
        purchaseDate: "2026-10-09"
        priceCents: 18950
        returnDeadline: "2026-11-08"
        warrantyExpiration: null
        status: active
    ItemResponse:
      type: object
      required: [item]
      properties:
        item: { $ref: "#/components/schemas/Item" }
    SubscriptionRequest:
      type: object
      required: [name, amountCents, billingCycle, firstBillingDate, timeZone]
      properties:
        name:
          type: string
          description: The service name. 1–100 characters after trimming, with at least one visible character and no control characters; the trimmed name is stored.
        amountCents:
          type: integer
          minimum: 0
          maximum: 99999999
          description: The amount of each charge in US cents, up to $999,999.99. Required; `0` is a free plan. Strings, fractions, and `null` are rejected.
        billingCycle: { type: string, enum: [monthly, yearly] }
        firstBillingDate:
          allOf: [{ $ref: "#/components/schemas/DateOnly" }]
          description: The recurring anchor. Any real date, including one in the future.
        timeZone:
          type: string
          description: The user's IANA time zone, used to calculate the response's `nextBillingDate`.
    SubscriptionStatusRequest:
      type: object
      required: [status, timeZone]
      properties:
        status: { type: string, enum: [active, cancelled] }
        timeZone: { type: string, description: The user's IANA time zone. }
    Subscription:
      type: object
      required: [id, name, amountCents, billingCycle, firstBillingDate, status, nextBillingDate]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        amountCents: { type: integer, minimum: 0 }
        billingCycle: { type: string, enum: [monthly, yearly] }
        firstBillingDate: { $ref: "#/components/schemas/DateOnly" }
        status: { type: string, enum: [active, cancelled] }
        nextBillingDate:
          oneOf: [{ $ref: "#/components/schemas/DateOnly" }, { type: "null" }]
          description: |
            The first occurrence of `firstBillingDate` on or after today in the request's time zone,
            including today (issue #8). Monthly plans keep the anchor day and use a shorter month's
            last day (Jan 31 → Feb 28 → Mar 31); a yearly Feb 29 anchor gives Feb 28 in other years.
            `null` while cancelled.
      example:
        id: 9d7a1c52-0d6f-4f4e-8a9b-3c1e2f4a5b6c
        name: Music plan
        amountCents: 1099
        billingCycle: monthly
        firstBillingDate: "2026-01-31"
        status: active
        nextBillingDate: "2026-10-31"
    SubscriptionResponse:
      type: object
      required: [subscription]
      properties:
        subscription: { $ref: "#/components/schemas/Subscription" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [validation_failed, invalid_json, email_taken, invalid_credentials, unauthenticated, not_found, forbidden_origin, server_error]
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Message per invalid request field.

  responses:
    BadRequest:
      description: The body is not JSON or not sent as `application/json` (`invalid_json`), or a field is invalid (`validation_failed`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            validation:
              value:
                error:
                  code: validation_failed
                  message: Check the highlighted fields.
                  fields:
                    email: Enter a valid email address, like name@example.com.
                    password: Password must be at least 8 characters.
            json:
              value: { error: { code: invalid_json, message: Send the request body as JSON. } }
    Unauthenticated:
      description: No valid session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthenticated, message: Sign in to continue. } }
    ForbiddenOrigin:
      description: The request came from another site.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: forbidden_origin, message: This request must come from the B4Gone site. } }
    ItemNotFound:
      description: The user has no item with this id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: Item not found. } }
    SubscriptionNotFound:
      description: The user has no subscription with this id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: Subscription not found. } }
    TimeZoneMissing:
      description: The `timeZone` query parameter is missing or not a known IANA time zone.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_failed
              message: Check the highlighted fields.
              fields: { timeZone: Your browser’s time zone could not be read. Reload the page and try again. }
    ServerError:
      description: An unexpected failure, such as an unreachable database. Details are never returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: server_error, message: Something went wrong. Please try again. } }
